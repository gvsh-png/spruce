<!doctype html>
<html><head><meta charset="utf-8"><title>Copy carries the name</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:800px;height:500px;overflow:hidden;background:#1d2b33}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:800px;height:500px;overflow:hidden;
 background:radial-gradient(120% 90% at 20% 10%,#5d7f86 0%,#35525c 40%,#1d2f38 75%,#15222a 100%)}
#menubar{position:absolute;top:0;left:0;right:0;height:24px;background:rgba(20,28,32,.55);
 display:flex;align-items:center;padding:0 14px;color:rgba(255,255,255,.88);font-size:12.5px;gap:16px}
#menubar b{font-weight:600}
#menubar .r{margin-left:auto;opacity:.85}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#pill{position:absolute;top:34px;left:220px;width:360px;height:46px;background:#000;border-radius:23px;
 border:0.5px solid rgba(255,255,255,.12);box-shadow:0 5px 24px rgba(0,0,0,.35);overflow:hidden;z-index:10;
 opacity:0;transform:translateY(-10px) scale(.94);transform-origin:top center;
 transition:height .3s cubic-bezier(.3,1.2,.4,1),opacity .25s,transform .38s cubic-bezier(.3,1.3,.4,1)}
#pill.open{opacity:1;transform:none}
#pill.tools{height:80px}
#pill.gone{opacity:0;transform:translateY(-10px) scale(.94)}
.row{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px}
.thumb{width:48px;height:30px;border-radius:6px;background:linear-gradient(#f4f5f7,#e3e6ea);position:relative;overflow:hidden;flex:none}
.thumb:before{content:"";position:absolute;left:5px;top:5px;width:22px;height:3px;background:#635bff;border-radius:2px}
.thumb:after{content:"";position:absolute;left:5px;top:12px;width:36px;height:2px;background:#c4c8cf;box-shadow:0 5px 0 #c4c8cf,0 10px 0 #d6d9de}
.name{font-size:13px;color:#fff;flex:1;white-space:nowrap;overflow:hidden}
.name .ext{color:rgba(255,255,255,.45)}
#naming{font-family:inherit;font-size:12px;color:rgba(255,255,255,.6)}
.check{width:16px;height:16px;border-radius:50%;background:#30d158;flex:none;position:relative;opacity:0;transition:opacity .25s}
.check:after{content:"";position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.toolsrow{height:34px;display:flex;align-items:center;gap:6px;padding:0 14px;opacity:0;transform:translateY(-8px);filter:blur(3px);transition:all .3s}
#pill.tools .toolsrow{opacity:1;transform:none;filter:none}
.btn{font-size:11px;font-weight:500;color:#fff;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);transition:transform .12s,background .15s;white-space:nowrap}
.btn.keep{color:#ffd60a;background:rgba(255,214,10,.12)}
.btn.hover{background:rgba(255,255,255,.22);transform:scale(1.04)}
.btn.press{background:rgba(255,255,255,.32);transform:scale(.92)}
.btn .t{display:inline-block;transition:opacity .15s}
.win{position:absolute;background:rgba(250,250,252,.97);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden}
.tb{height:28px;background:#ececee;border-bottom:1px solid #d9d9dc;display:flex;align-items:center;padding:0 10px;gap:6px;font-size:12px;color:#444}
.dot{width:11px;height:11px;border-radius:50%}
.tb .ttl{margin-left:10px;font-weight:600;color:#333}
#chat{left:120px;top:130px;width:560px;height:290px;opacity:0;transform:translateY(12px);transition:all .45s ease}
#chat.show{opacity:1;transform:none}
.msgs{padding:14px 18px;font-size:13px;color:#1d1d1f}
.msg{display:flex;gap:10px;margin-bottom:12px}
.av{width:30px;height:30px;border-radius:7px;flex:none}
.who{font-weight:700;font-size:13px;margin-bottom:2px}
.who span{font-weight:400;color:#888;font-size:11px;margin-left:6px}
.composer{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border:1px solid #cfcfd4;border-radius:9px;background:#fff;padding:10px 12px;font-size:13px;color:#999}
#ph{position:absolute;left:12px;top:10px;transition:opacity .2s}
.att{display:inline-flex;align-items:center;gap:9px;border:1px solid #dadade;border-radius:8px;padding:5px 12px 5px 5px;background:#fafafa;color:#1d1d1f;
 opacity:0;transform:scale(.9);transform-origin:left center;transition:all .35s cubic-bezier(.3,1.3,.4,1)}
.att.show{opacity:1;transform:none}
.att .mini{width:34px;height:24px;border-radius:4px;background:linear-gradient(#f4f5f7,#e3e6ea);position:relative;overflow:hidden;border:1px solid #e0e0e4}
.att .mini:before{content:"";position:absolute;left:4px;top:4px;width:14px;height:2px;background:#635bff}
.att .fn{font-size:12.5px;font-weight:600}
.att .sz{font-size:10.5px;color:#888}
#cur{position:absolute;left:640px;top:330px;width:18px;height:24px;z-index:20;transition:left .6s cubic-bezier(.45,0,.2,1),top .6s cubic-bezier(.45,0,.2,1),transform .1s}
#cur.click{transform:scale(.85)}
#keys{position:absolute;left:400px;top:440px;transform:translateX(-50%) translateY(6px);background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;opacity:0;transition:all .25s;z-index:15}
#keys.show{opacity:1;transform:translateX(-50%)}
#cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:rgba(255,255,255,.95);font-size:13.5px;font-weight:500;opacity:0;transition:opacity .5s;z-index:14}
#cap.show{opacity:1}
#cap .mono{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px;font-size:12.5px}
#cap s{opacity:.6}
</style></head><body>
<div id="stage">
 <div id="menubar"><b>Slack</b><span>File</span><span>Edit</span><span>View</span><div class="r">Tue 3 Nov 10:42</div></div>

 <div id="chat" class="win">
  <div class="tb"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><span class="ttl"># finance</span></div>
  <div class="msgs">
   <div class="msg"><div class="av" style="background:#e8a87c"></div><div><div class="who">Maya<span>10:39</span></div>Can you send me the Stripe invoice for March?</div></div>
  </div>
  <div class="composer"><span id="ph">Message #finance</span>
   <div class="att" id="att"><div class="mini"></div><div><div class="fn">stripe-invoice-march.png</div><div class="sz">PNG · 412 KB</div></div></div>
  </div>
 </div>

 <div id="pill">
  <div class="row">
   <div class="thumb"></div>
   <div class="name mono"><span id="stem"><span id="naming">Naming…</span></span><span class="ext" id="ext"></span></div>
   <div class="check" id="check"></div>
  </div>
  <div class="toolsrow">
   <span class="btn keep">Keep</span>
   <span class="btn" id="copy"><span class="t" id="copyT">Copy</span></span>
   <span class="btn">Copy Text</span>
   <span class="btn">Move ▾</span>
   <span class="btn">Delete</span>
  </div>
 </div>

 <div id="keys">⌘V</div>
 <div id="cap">Copy pastes the renamed file: <span class="mono">stripe-invoice-march.png</span> &nbsp;<s>image.png</s></div>

 <svg id="cur" viewBox="0 0 18 24"><path d="M1 1 L1 19 L5.5 14.8 L8.6 22 L11.6 20.7 L8.6 13.8 L14.5 13.8 Z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>
<script>
const $=id=>document.getElementById(id);
const pill=$('pill'),cur=$('cur');
const at=(ms,f)=>setTimeout(f,ms);
const move=(x,y)=>{cur.style.left=x+'px';cur.style.top=y+'px'};
const click=()=>{cur.classList.add('click');setTimeout(()=>cur.classList.remove('click'),130)};
at(150,()=>$('chat').classList.add('show'));
at(450,()=>pill.classList.add('open'));
at(1200,()=>{$('stem').textContent='stripe-invoice-march';$('ext').textContent='.png';$('check').style.opacity=1});
at(1400,()=>move(360,62));
at(1900,()=>pill.classList.add('tools'));
at(2150,()=>{const r=$('copy').getBoundingClientRect(),s=$('stage').getBoundingClientRect();move(r.left-s.left+r.width/2-3,r.top-s.top+r.height/2-2)});
at(2750,()=>$('copy').classList.add('hover'));
at(3000,()=>{click();$('copy').classList.add('press')});
at(3150,()=>{$('copy').classList.remove('press');$('copyT').style.opacity=0;at(150,()=>{$('copyT').textContent='Copied';$('copyT').style.opacity=1})});
at(3750,()=>{$('copy').classList.remove('hover');move(330,385)});
at(4100,()=>{pill.classList.remove('tools');pill.classList.add('gone')});
at(4500,()=>{click();$('keys').classList.add('show')});
at(4750,()=>{$('ph').style.opacity=0;$('att').classList.add('show')});
at(5300,()=>{$('keys').classList.remove('show');$('cap').classList.add('show')});
</script>
</body></html>
